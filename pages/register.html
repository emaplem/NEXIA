<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Nexia</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<section class="login">

    <div class="login-box">

        <h1>Crear cuenta 🤖</h1>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre completo">

        <input
            type="email"
            id="correoRegistro"
            placeholder="Correo electrónico">

        <input
            type="password"
            id="passwordRegistro"
            placeholder="Contraseña">

        <button onclick="registrarUsuario()">

            Registrarse

        </button>

        <p>
            ¿Ya tienes cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>

    </div>

</section>

<script src="../js/auth.js"></script>

</body>

</html>
